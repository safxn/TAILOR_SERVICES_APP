<div style="display:flex; gap:1rem; margin-bottom:1rem">
  <p-button label="New Customer" icon="pi pi-plus" routerLink="/customers/new" />
  <input pInputText placeholder="Search name, phone, address..."
         (keyup.enter)="onSearch($any($event.target).value)" />
</div>

<p-table [value]="customers()"
         [lazy]="true"
         (onLazyLoad)="load($event)"
         [paginator]="true"
         [rows]="10"
         [totalRecords]="total()"
         [loading]="loading()">

  <ng-template #header>
    <tr>
      <th pSortableColumn="name">Name <p-sorticon field="name" /></th>
      <th pSortableColumn="phone">Phone <p-sorticon field="phone" /></th>
      <th>Address</th>
      <th pSortableColumn="createdAt">Created <p-sorticon field="createdAt" /></th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-c>
    <tr>
      <td>{{ c.name }}</td>
      <td>{{ c.phone }}</td>
      <td>{{ c.address }}</td>
      <td>{{ c.createdAt | date: 'dd MMM yyyy' }}</td>
      <td>
        <p-button icon="pi pi-pencil" [text]="true" [routerLink]="['/customers', c.id, 'edit']" />
        <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="remove(c.id)" />
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr><td colspan="5">No customers found.</td></tr>
  </ng-template>
</p-table>
